<!doctype html>
<html lang="fa" dir="rtl" class="dark" data-theme="dark" data-panel-version="3.6.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>BotPanel — پنل مدیریت ربات سروش+</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232aabee'%3E%3Cpath d='M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z'/%3E%3C/svg%3E">
    <script>
    (function () {
      try {
        var themes = ['dark', 'light', 'ocean', 'violet', 'forest', 'sunset'];
        var t = localStorage.getItem('bp_theme') || 'dark';
        if (themes.indexOf(t) < 0) t = 'dark';
        var l = localStorage.getItem('bp_lang') || 'fa';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        var isDark = t !== 'light';
        if (isDark) d.classList.add('dark'); else d.classList.remove('dark');
        try { d.style.colorScheme = isDark ? 'dark' : 'light'; } catch (e2) {}
        d.lang = l; d.dir = (l === 'fa') ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
</script>
  <link rel="stylesheet" href="/panel.css?v=3.6.0">
  <link rel="stylesheet" href="/studio.css?v=3.6.0">
