<!doctype html>
<html lang="fa" dir="rtl" class="dark" data-theme="dark" data-panel-version="3.6.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>BotPanel — پنل مدیریت ربات سروش+</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232aabee'%3E%3Cpath d='M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var themes = ['dark', 'light', 'ocean', 'violet', 'forest', 'sunset'];
        var t = localStorage.getItem('bp_theme') || 'dark';
        if (themes.indexOf(t) < 0) t = 'dark';
        var l = localStorage.getItem('bp_lang') || 'fa';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        var isDark = t !== 'light';
        if (isDark) d.classList.add('dark'); else d.classList.remove('dark');
        try { d.style.colorScheme = isDark ? 'dark' : 'light'; } catch (e2) {}
        d.lang = l; d.dir = (l === 'fa') ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/panel.css?v=3.6.0">
  <link rel="stylesheet" href="/studio.css?v=3.6.0">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div id="app"></div>
  <div id="toast-root" class="fixed z-[100] top-3 inset-x-0 flex flex-col items-center gap-2 w-[min(92vw,380px)] pointer-events-none mx-auto"></div>
  <div id="dd-panel" role="listbox" class="hidden"></div>
  <div id="save-bar" class="hidden fixed inset-x-0 z-40 bottom-[calc(3.75rem+env(safe-area-inset-bottom))] md:bottom-4 pointer-events-none px-3">
    <div class="max-w-3xl mx-auto">
      <div id="save-bar-box" class="pointer-events-auto flex items-center gap-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900/95 backdrop-blur shadow-lg px-3.5 py-3">
        <span id="save-bar-msg" role="status" class="flex-1 min-w-0 text-xs font-semibold text-slate-500 dark:text-slate-400"></span>
        <button id="save-bar-btn" type="button" data-act="saveAll" class="inline-flex items-center gap-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2.5">
          <i data-lucide="save" class="w-4 h-4"></i><span id="save-bar-btn-label">ذخیره همه تغییرات</span>
        </button>
      </div>
    </div>
  </div>
  <noscript><div style="padding:2rem;text-align:center">This app requires JavaScript / این پنل به جاوااسکریپت نیاز دارد.</div></noscript>
  <script src="/vendor/telegram-web-app.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/panel.js?v=3.6.0"></script>
  <script src="/studio.js?v=3.6.0"></script>
  <script src="/services.js?v=3.6.0"></script>
  <script>
  (async function () {
    if (window.Telegram && window.Telegram.WebApp) {
      try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
      const initData = window.Telegram.WebApp.initData;
      if (initData && !S.token) {
        try {
          const r = await fetch('/api/auth/telegram-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData }),
          });
          const j = await r.json();
          if (j && j.ok && j.data && j.data.token) {
            S.token = j.data.token;
            sessionStorage.setItem('bp_token', j.data.token);
            S.mustChangePassword = !!j.data.requiresPasswordChange;
          }
        } catch (e) {}
      }
    }
    if (S.token) {
      try {
        const session = await api('/auth/session');
        S.mustChangePassword = !!session.requiresPasswordChange;
        if (!S.mustChangePassword) await initV2();
      } catch (e) {}
    }
    render();
  })();
  </script>
</body>
</html>
