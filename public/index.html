    <script>
    (function () {
      try {
        var themes = ['dark', 'light', 'ocean', 'violet', 'forest', 'sunset'];
        var t = localStorage.getItem('bp_theme') || 'dark';
        if (themes.indexOf(t) < 0) t = 'dark';
        var l = localStorage.getItem('bp_lang') || 'fa';
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        var isDark = t !== 'light';
        if (isDark) d.classList.add('dark'); else d.classList.remove('dark');
        try { d.style.colorScheme = isDark ? 'dark' : 'light'; } catch (e2) {}
        d.lang = l; d.dir = (l === 'fa') ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
</script>

    <div id="modal-wrap" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" data-act="modalClose"></div>
    <div id="modal-box" class="relative w-full max-w-lg rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl animate-fadeIn max-h-[90vh] overflow-y-auto"></div>
  </div>

    <div id="toasts" class="fixed z-[60] left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 w-[min(92vw,380px)] pointer-events-none"></div>
    <div id="dd-panel" role="listbox" class="hidden"></div>

    <div id="save-bar" class="hidden fixed inset-x-0 z-40 bottom-[calc(3.75rem+env(safe-area-inset-bottom))] md:bottom-4 pointer-events-none px-3">
      <div class="max-w-3xl mx-auto">
        <div id="save-bar-box" class="pointer-events-auto flex items-center gap-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900/95 backdrop-blur shadow-lg shadow-slate-950/10 px-3.5 py-3">
          <span id="save-bar-msg" role="status" aria-live="polite" class="flex-1 min-w-0 text-xs font-semibold text-slate-500 dark:text-slate-400 leading-5"></span>
          <button id="save-bar-btn" type="button" data-act="saveAll" class="inline-flex items-center justify-center gap-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2.5 transition disabled:opacity-50 disabled:cursor-not-allowed shrink-0"><i data-lucide="save" class="w-4 h-4"></i><span id="save-bar-btn-label">ذخیره همه تغییرات</span></button>
        </div>
      </div>
    </div>

  <noscript><div style="padding:2rem;text-align:center">This app requires JavaScript / این پنل به جاوااسکریپت نیاز دارد.</div></noscript>

    <script src="/vendor/telegram-web-app.js"></script>
    <script src="/vendor/lucide.min.js"></script>

<script src="/panel.js?v=3.6.0"></script>
<script src="/studio.js?v=3.6.0"></script>
<script src="/services.js?v=3.6.0"></script>
<script>
(async function () {
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch (e) {}
    const initData = window.Telegram.WebApp.initData;
    if (initData && !S.token) {
      try {
        const r = await fetch('/api/auth/telegram-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData }),
        });
        const j = await r.json();
        if (j && j.ok && j.data && j.data.token) {
          S.token = j.data.token;
          sessionStorage.setItem('bp_token', j.data.token);
          S.mustChangePassword = !!j.data.requiresPasswordChange;
        }
      } catch (e) {}
    }
  }
  if (S.token) { try { const session = await api('/auth/session'); S.mustChangePassword = !!session.requiresPasswordChange; if (!S.mustChangePassword) await initV2(); } catch (e) {} }
  render();
})();
</script>
</body>
</html>
